name: ControlDeck

options:
  bundleIdPrefix: app.callingcard
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ControlDeck:
    type: application
    platform: iOS
    sources:
      - path: ControlDeck
        excludes:
          - "Info.plist"
          - "Resources/**"
          - "Assets.xcassets/**"
      - path: ControlDeck/Resources
        type: folder
        buildPhase: resources
      - path: ControlDeck/Assets.xcassets
        buildPhase: resources
    info:
      path: ControlDeck/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"           # iPhone + iPad
        PRODUCT_BUNDLE_IDENTIFIER: app.callingcard.controldeck
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ----- Code signing (overridable via xcconfig or CI flags) -----
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                    # leave blank — set yours in Xcode or via CI
    info:
      path: ControlDeck/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: NO
        ITSAppUsesNonExemptEncryption: NO
