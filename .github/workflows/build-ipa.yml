name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -e
          xcodebuild \
            -project ControlDeck.xcodeproj \
            -scheme ControlDeck \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build
      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ControlDeck.app"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr ControlDeck-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ControlDeck-unsigned-ipa
          path: ControlDeck-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
