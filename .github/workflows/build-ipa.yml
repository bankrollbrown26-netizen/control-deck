name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - run: brew install xcodegen

      - run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild \
            -project ControlDeck.xcodeproj \
            -scheme ControlDeck \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            clean build

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ControlDeck.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App not found at $APP"
            ls -laR build/Build/Products/ || true
            exit 1
          fi
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ControlDeck-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ControlDeck-unsigned-ipa
          path: ControlDeck-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
